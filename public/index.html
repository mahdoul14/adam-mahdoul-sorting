<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam Mahdoul Sorting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1f22;
    --muted: #7d8287;
    --line: rgba(28, 31, 34, .09);
    --card: rgba(255, 255, 255, .86);
    --accent: #8fa89b;       /* sage */
    --accent-deep: #2f5d62;  /* slate teal */
    --placeholder: #e4e2dc;
    --tile: 30px;
    --slot: 26px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 14px/1.4 Inter, system-ui, sans-serif;
    background:
      radial-gradient(1200px 700px at 85% -10%, #dfe7e2 0%, transparent 60%),
      radial-gradient(900px 600px at -10% 110%, #e8e3da 0%, transparent 55%),
      #f6f5f2;
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .wrap { max-width: 1520px; margin: 0 auto; padding: 32px 40px 120px; }

  header { display: flex; align-items: flex-start; gap: 18px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: linear-gradient(145deg, #3d6b70, #1f3f43); color: #fff; font: 600 18px Inter, sans-serif;
    box-shadow: 0 6px 20px rgba(47, 93, 98, .3);
  }
  .eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  .eyebrow b { color: var(--ink); font-weight: 600; }
  h1 { margin: 2px 0 0; font-size: 44px; font-weight: 600; letter-spacing: -.03em; line-height: 1.05; }
  h1 em { font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; color: var(--accent-deep); letter-spacing: 0; font-size: 1.12em; }
  .controls { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 20px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-deep); opacity: 0; }
  .status.live .dot { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .4; } }
  .dir {
    border: 1px solid var(--line); background: rgba(255,255,255,.6); border-radius: 999px;
    padding: 9px 14px; font: inherit; font-size: 13px; width: 200px; color: var(--ink);
  }
  .sort-btn {
    display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer;
    font: 600 15px Inter, sans-serif; color: var(--ink); padding: 0;
  }
  .sort-btn .orb {
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #fff 0 14%, #b9cbc1 15% 55%, #5f8a86 56% 100%);
    box-shadow: 0 8px 22px rgba(47, 93, 98, .3); transition: transform .2s;
  }
  .sort-btn:hover .orb { transform: scale(1.08) rotate(20deg); }
  .sort-btn:disabled { opacity: .45; cursor: default; }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin: 30px 0 22px; }
  .stat { padding: 14px 18px; border-radius: 18px; background: var(--card); border: 1px solid rgba(255,255,255,.9); }
  .stat label { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .stat .num { font-size: 32px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

  .stage { position: relative; display: grid; grid-template-columns: 1fr minmax(320px, 440px) 1fr; gap: 28px; min-height: 620px; align-items: start; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* Cards fade in without moving, so slot positions can be measured once and cached. */
  .card {
    contain: layout paint;
    background: var(--card); border: 1px solid rgba(255,255,255,.95); border-radius: 20px; padding: 12px 14px 14px;
    box-shadow: 0 10px 30px rgba(30, 50, 55, .07); cursor: pointer;
    opacity: 0; transition: opacity .5s ease, box-shadow .2s;
  }
  .card.in { opacity: 1; }
  .card:hover { box-shadow: 0 14px 36px rgba(30, 50, 55, .13); }
  .card.hit { box-shadow: 0 0 0 2px var(--accent-deep), 0 14px 36px rgba(30, 50, 55, .13); }
  .card-head { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; margin-bottom: 10px; }
  .card-head svg { width: 15px; height: 15px; color: var(--accent-deep); flex: none; }
  .card-head .count { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* Each folder's thumbnails are painted into one canvas per card. */
  .slots { display: block; width: 100%; }

  .pile-col { display: flex; flex-direction: column; align-items: center; position: sticky; top: 16px; }
  .pile { position: relative; width: 100%; aspect-ratio: 1; }
  .spin { position: absolute; inset: 0; will-change: transform; }
  .spin canvas { width: 100%; height: 100%; display: block; }
  .ring { position: absolute; inset: 4%; border-radius: 50%; border: 1px dashed rgba(47,93,98,.3); opacity: 0; transition: opacity .6s; }
  .ring.on { opacity: 1; animation: spin 18s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .caption { margin-top: 14px; font: italic 17px 'Instrument Serif', serif; color: var(--muted); min-height: 24px; text-align: center; }
  .bar { width: 220px; height: 3px; border-radius: 3px; background: rgba(28,31,34,.07); overflow: hidden; margin-top: 8px; opacity: 0; transition: opacity .3s; }
  .bar.on { opacity: 1; }
  .bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--accent), var(--accent-deep)); transition: transform .3s; }

  /* Only flying tiles are DOM nodes; the pile itself is drawn on a canvas. */
  .tile {
    position: absolute; width: var(--tile); height: var(--tile); border-radius: 8px;
    border: 2px solid #fff; background: var(--placeholder) center/cover no-repeat;
  }
  #layer { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 50; }
  /* Flying tiles are the pile's own pre-drawn sprite canvases: nothing to load or decode mid-flight. */
  canvas.fly { position: absolute; left: 0; top: 0; width: var(--tile); height: var(--tile); border-radius: 8px; box-shadow: 0 5px 12px rgba(20, 30, 35, .2); will-change: transform; }

  .done-actions { display: none; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .done-actions.on { display: flex; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 10px 18px; font: 500 13px Inter, sans-serif; cursor: pointer; color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ----- command bar (voice + type) ----- */
  .cmd {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 80;
    display: flex; align-items: center; gap: 10px; width: min(560px, calc(100% - 32px));
    background: rgba(28, 31, 34, .92); color: #fff; border-radius: 999px; padding: 8px 8px 8px 20px;
    box-shadow: 0 18px 40px rgba(20, 30, 35, .28);
  }
  .cmd input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #fff; font: 14px Inter, sans-serif; }
  .cmd input::placeholder { color: rgba(255,255,255,.5); }
  .mic {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; flex: none; position: relative;
    background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center;
  }
  .mic svg { width: 18px; height: 18px; }
  .mic.live { background: #e05a4f; }
  .mic.live::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #e05a4f; animation: ripple 1.2s ease-out infinite; }
  @keyframes ripple { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .wave { display: none; gap: 3px; align-items: center; height: 18px; }
  .mic.live + .wave { display: flex; }
  .wave i { width: 3px; border-radius: 2px; background: #fff; animation: wave .9s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: .15s } .wave i:nth-child(3) { animation-delay: .3s } .wave i:nth-child(4) { animation-delay: .45s }
  @keyframes wave { 0%, 100% { height: 4px; } 50% { height: 18px; } }
  .hint { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); font-size: 12px; color: var(--muted); z-index: 80; text-align: center; transition: opacity .3s; white-space: nowrap; }
  .toast {
    position: fixed; left: 50%; top: 18px; transform: translate(-50%, -8px); z-index: 81; opacity: 0;
    background: #fff; color: var(--ink); border-radius: 12px; padding: 8px 14px; font-size: 13px;
    box-shadow: 0 10px 30px rgba(20,30,35,.15); transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ----- folder view ----- */
  .viewer {
    position: fixed; inset: 0; z-index: 90; display: none;
    background: rgba(240, 239, 235, .7); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .viewer.on { display: block; }
  .sheet {
    position: absolute; inset: 40px max(40px, calc(50% - 640px)) 100px; background: #fff; border-radius: 28px;
    box-shadow: 0 30px 80px rgba(20, 30, 35, .18); display: flex; flex-direction: column; overflow: hidden;
    transform-origin: top left;
  }
  .sheet-head { display: flex; align-items: baseline; gap: 14px; padding: 26px 30px 14px; }
  .sheet-head h2 { margin: 0; font: italic 400 40px/1 'Instrument Serif', serif; }
  .sheet-head span { color: var(--muted); font-size: 13px; }
  .sheet-head button { margin-left: auto; border: 0; background: #f1f0ec; border-radius: 999px; width: 36px; height: 36px; cursor: pointer; font-size: 18px; color: var(--ink); }
  .sheet-scroll { flex: 1; min-height: 0; overflow: auto; }
  .sheet-grid { padding: 6px 30px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; align-content: start; }
  .sheet-grid figure { margin: 0; aspect-ratio: 1; min-width: 0; border-radius: 14px; overflow: hidden; background: var(--placeholder); position: relative; }
  .sheet-grid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheet-grid figure.video::after { content: 'VIDEO'; position: absolute; left: 8px; bottom: 8px; font-size: 9px; letter-spacing: .1em; font-weight: 600; color: #fff; background: rgba(0,0,0,.45); padding: 3px 6px; border-radius: 5px; }
  .sheet-grid .empty { grid-column: 1 / -1; color: var(--muted); padding: 40px 0; text-align: center; }

  .mute { width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; flex: none; background: none; color: rgba(255,255,255,.7); display: grid; place-items: center; }
  .mute svg { width: 17px; height: 17px; }
  .mute .off { display: none; }
  .mute.muted .on { display: none; } .mute.muted .off { display: block; }

  /* What the assistant says, as subtitles (reels are mostly watched muted). */
  .say {
    position: fixed; left: 50%; bottom: 88px; z-index: 82; max-width: min(560px, calc(100% - 32px));
    transform: translate(-50%, 10px); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
    display: flex; gap: 10px; align-items: flex-start;
    background: #fff; border-radius: 18px; padding: 11px 16px 11px 12px; box-shadow: 0 14px 34px rgba(20,30,35,.16);
    font-size: 14.5px; line-height: 1.4;
  }
  .say.on { opacity: 1; transform: translate(-50%, 0); }
  .say .who { width: 24px; height: 24px; border-radius: 50%; flex: none; background: linear-gradient(145deg, #3d6b70, #1f3f43); position: relative; }
  .say.talking .who::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); animation: ripple 1.2s ease-out infinite; }
  .say b { font-weight: 600; }

  /* ----- Downloads Wrapped ----- */
  .wrapped { position: fixed; inset: 0; z-index: 95; display: none; background: #121517; color: #f4f2ee; overflow: hidden; }
  .wrapped.on { display: block; }
  .w-bars { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 32px)); display: flex; gap: 5px; z-index: 3; }
  .w-bars i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
  .w-bars i b { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; transform: scaleX(0); }
  .w-close { position: absolute; top: 30px; right: 22px; z-index: 4; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 20px; cursor: pointer; }
  .w-brand { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .08em; color: rgba(255,255,255,.5); z-index: 3; }
  .w-slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 70px 24px 60px; }
  .w-bg { position: absolute; inset: -10%; display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; opacity: .16; transform: rotate(-8deg); filter: saturate(.8); pointer-events: none; }
  .w-bg img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
  .w-glow { position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%; filter: blur(80px); opacity: .55; pointer-events: none; }
  .w-kicker { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 18px; position: relative; }
  .w-big { font: 600 clamp(64px, 12vw, 150px)/0.95 Inter, sans-serif; letter-spacing: -.05em; position: relative; font-variant-numeric: tabular-nums; }
  .w-serif { font: italic 400 clamp(56px, 9vw, 120px)/1 'Instrument Serif', serif; position: relative; }
  .w-sub { margin-top: 18px; font-size: clamp(16px, 2vw, 21px); color: rgba(255,255,255,.75); max-width: 560px; position: relative; }
  .w-mosaic { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(300px, 70vw); margin-top: 28px; position: relative; }
  .w-mosaic img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
  .w-band { display: flex; width: min(720px, 92vw); height: 86px; margin-top: 30px; border-radius: 16px; overflow: hidden; position: relative; }
  .w-band img { flex: 1; min-width: 0; height: 100%; object-fit: cover; }
  .w-swatch { width: 92px; height: 92px; border-radius: 50%; margin-bottom: 26px; position: relative; box-shadow: 0 0 0 6px rgba(255,255,255,.08); }
  .w-cta { margin-top: 30px; display: flex; gap: 10px; position: relative; flex-wrap: wrap; justify-content: center; }
  .w-cta .btn { background: #fff; color: var(--ink); border: 0; }
  .w-cta .btn.ghost { background: rgba(255,255,255,.12); color: #fff; }
  .w-rise { opacity: 0; }

  @media (max-width: 1100px) {
    .wrap { padding: 20px 16px 120px; }
    h1 { font-size: 32px; }
    header { flex-wrap: wrap; }
    .controls { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stage { grid-template-columns: 1fr; }
    .pile-col { order: -1; position: static; }
    .pile { max-width: 420px; }
    .sheet { inset: 16px 16px 90px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar">AM</div>
    <div>
      <div class="eyebrow"><b>Adam Mahdoul Sorting</b> · on-device AI</div>
      <h1>Sorting my <em id="dirName">Downloads</em> folder</h1>
    </div>
    <div class="controls">
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
      <input class="dir" id="dir" value="~/Downloads" spellcheck="false" aria-label="Folder to sort">
      <button class="sort-btn" id="sortBtn"><span class="orb"></span>Sort</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><label>Total files</label><div class="num" id="sTotal">0</div></div>
    <div class="stat"><label>Photos</label><div class="num" id="sPhotos">0</div></div>
    <div class="stat"><label>Videos</label><div class="num" id="sVideos">0</div></div>
    <div class="stat"><label>Folders created</label><div class="num" id="sFolders">0</div></div>
    <div class="stat"><label>Duplicates found</label><div class="num" id="sDupes">0</div></div>
  </div>

  <div class="stage" id="stage">
    <div class="col" id="left"><div class="grid"></div></div>
    <div class="pile-col">
      <div class="pile" id="pile"><div class="ring" id="ring"></div><div class="spin" id="spin"></div></div>
      <div class="caption" id="caption">Press Sort, or say “sort my downloads”</div>
      <div class="bar" id="bar"><i></i></div>
      <div class="done-actions" id="doneActions">
        <button class="btn primary" id="wrapBtn">Your Downloads, Wrapped</button>
        <button class="btn" id="copyBtn">Copy into Sorted/</button>
        <button class="btn" id="moveBtn">Move originals</button>
      </div>
    </div>
    <div class="col" id="right"><div class="grid"></div></div>
  </div>
</div>
<div id="layer"></div>

<div class="hint" id="hint">Try “sort my downloads” · “pull up outfits” · “find sneakers” · “show my wrapped” — hold <b>Space</b> to talk</div>
<div class="say" id="say"><span class="who"></span><span id="sayText"></span></div>
<div class="toast" id="toast"></div>
<form class="cmd" id="cmd" autocomplete="off">
  <input id="cmdInput" placeholder="Say or type a command…" aria-label="Command">
  <button type="button" class="mic" id="mic" aria-label="Voice command">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <div class="wave"><i></i><i></i><i></i><i></i></div>
  <button type="button" class="mute" id="mute" aria-label="Mute voice">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</form>

<div class="viewer" id="viewer">
  <div class="sheet" id="sheet">
    <div class="sheet-head"><h2 id="vTitle"></h2><span id="vCount"></span><button id="vClose" aria-label="Close">×</button></div>
    <div class="sheet-scroll" id="vScroll"><div class="sheet-grid" id="vGrid"></div></div>
  </div>
</div>

<div class="wrapped" id="wrapped" aria-label="Downloads Wrapped">
  <div class="w-bars" id="wBars"></div>
  <button class="w-close" id="wClose" aria-label="Close">×</button>
  <div id="wStage"></div>
  <div class="w-brand">ADAM MAHDOUL SORTING · @adammahdoul</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const ROWS = 4, SPIN_MS = 40000, MAX_IN_FLIGHT = 70, SLOT = 26, GAP = 4, PITCH = SLOT + GAP;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let tiles = new Map();   // id -> { el, item, dx, dy, rot, hasThumb }
let cards = new Map();   // category -> card state
let queue = [];          // { id, category } waiting to fly
let inFlight = 0, landed = 0, serverDone = false, running = false, spinAnim = null, flightStart = 0, launchCredit = 0;
let runItems = [], pending = null; // pending: a yes/no question the assistant just asked

function setStatus(text, live) {
  $('statusText').textContent = text;
  $('status').classList.toggle('live', !!live);
}

function tween(el, to, ms = 600) {
  const from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / ms);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))).toLocaleString();
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function toast(text) {
  const t = $('toast');
  t.textContent = text; t.classList.add('on');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('on'), 2200);
}

function reset() {
  tiles.clear(); cards.clear(); queue = []; readyCount = 0; runItems = []; pending = null;
  inFlight = landed = 0; serverDone = false;
  spinAnim?.cancel();
  pileCanvas = null; pileOrder = []; morphStart = morphEnd = 0;
  $('spin').innerHTML = ''; $('layer').innerHTML = '';
  document.querySelectorAll('.col .grid').forEach((g) => g.innerHTML = '');
  ['sTotal', 'sPhotos', 'sVideos', 'sFolders', 'sDupes'].forEach((id) => { $(id).textContent = '0'; $(id).dataset.v = 0; });
  $('doneActions').classList.remove('on');
  $('copyBtn').disabled = $('moveBtn').disabled = false;
}

// ----- pile -----
// The ball is one canvas inside a rotating wrapper: the rotation is pure compositing,
// and the canvas is only redrawn when a tile leaves or a thumbnail arrives.

// Every thumbnail is painted once into a single atlas canvas, so drawing the ball is
// ~1,700 blits from one texture instead of 1,700 texture switches.
const TILE = 30, DPR = Math.min(2, devicePixelRatio || 1), CELL = TILE * DPR;
let pileCanvas = null, pileCtx = null, pileW = 0, pileDirty = false, pileOrder = [], entranceEnd = 0, lastDraw = 0;
let atlas = null, atlasCtx = null, atlasCols = 1, readyCount = 0, lastLoadAt = 0;

function paintSprite(g, x, y, img, size = TILE) {
  g.save();
  g.translate(x, y); g.scale(DPR * size / TILE, DPR * size / TILE);
  const round = (a, b, w, h, r) => { g.beginPath(); g.roundRect(a, b, w, h, r); };
  g.fillStyle = '#fff'; round(0, 0, TILE, TILE, 8); g.fill();
  round(2, 2, TILE - 4, TILE - 4, 6.5); g.clip();
  if (img) {
    const s = Math.min(img.width, img.height);
    g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 2, 2, TILE - 4, TILE - 4);
  } else {
    g.fillStyle = '#e4e2dc'; g.fillRect(2, 2, TILE - 4, TILE - 4);
  }
  g.restore();
}

// The flying tile: a copy of the tile's pre-rendered bitmap (no decode, no GPU readback).
function spriteCanvas(t) {
  const c = document.createElement('canvas');
  c.width = c.height = CELL;
  c.getContext('2d').drawImage(t.bmp, 0, 0);
  return c;
}

function buildPile(items) {
  pileW = $('pile').clientWidth;
  pileCanvas = document.createElement('canvas');
  pileCanvas.width = pileCanvas.height = Math.round(pileW * DPR);
  pileCtx = pileCanvas.getContext('2d');
  $('spin').appendChild(pileCanvas);
  const R = pileW / 2 - 26, now = performance.now();
  atlasCols = Math.ceil(Math.sqrt(items.length + 1));
  atlas = document.createElement('canvas');
  atlas.width = atlas.height = atlasCols * CELL;
  atlasCtx = atlas.getContext('2d');
  // Cell 0 is the grey placeholder; tile i lives in cell i + 1.
  paintSprite(atlasCtx, 0, 0, null);
  pileOrder = items.map((item, i) => {
    // Denser toward the centre, like a heap.
    const a = Math.random() * Math.PI * 2;
    const r = Math.pow(Math.random(), 0.65) * R;
    const t = {
      item, dx: Math.cos(a) * r, dy: Math.sin(a) * r, rot: (Math.random() - .5) * 50,
      ready: false, inPile: true, hasThumb: false, labels: [], hue: 0, sat: 0, lum: .5,
      ax: ((i + 1) % atlasCols) * CELL, ay: Math.floor((i + 1) / atlasCols) * CELL,
      appearAt: reduceMotion ? 0 : now + Math.min(i * 1.2, 1800),
    };
    tiles.set(item.id, t);
    return t;
  });
  entranceEnd = reduceMotion ? 0 : now + 1800 + 700;
  if (!reduceMotion) {
    spinAnim = $('spin').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: SPIN_MS, iterations: Infinity });
  }
  pileDirty = true;
  requestAnimationFrame(drawPileLoop);
}

const easeOut = (k) => 1 - Math.pow(1 - k, 3);
function drawPile(now) {
  const g = pileCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, pileCanvas.width, pileCanvas.height);
  const c = pileW / 2;
  for (const t of pileOrder) {
    if (!t.inPile) continue;
    let k = 1;
    if (now < entranceEnd) { k = Math.max(0, Math.min(1, (now - t.appearAt) / 700)); if (!k) continue; }
    const e = easeOut(k);
    const p = morphPose(t, now);
    const rot = (p.rot * (3 - 2 * e)) * Math.PI / 180;
    const sc = .6 + .4 * e;
    g.globalAlpha = k;
    const cos = Math.cos(rot) * sc * DPR, sin = Math.sin(rot) * sc * DPR;
    g.setTransform(cos, sin, -sin, cos, (c + p.dx) * DPR, (c + p.dy - 120 * (1 - e)) * DPR);
    g.drawImage(atlas, t.ready ? t.ax : 0, t.ready ? t.ay : 0, CELL, CELL, -TILE / 2, -TILE / 2, TILE, TILE);
  }
  g.globalAlpha = 1;
}

function drawPileLoop(now) {
  if (!pileCanvas) return;
  // During the entrance draw every frame; afterwards cap redraws at ~30fps — the spin itself is composited.
  if (now < entranceEnd || now < morphEnd + 30 || (pileDirty && now - lastDraw > 30)) { drawPile(now); pileDirty = false; lastDraw = now; }
  requestAnimationFrame(drawPileLoop);
}

// Thumbnails are generated server-side; load them once they exist, in batches of up to 200
// per request, and decode off the main thread with createImageBitmap.
function showThumbs(ids) {
  const batch = [];
  for (const id of ids) {
    const t = tiles.get(id);
    if (!t || t.hasThumb) continue;
    t.hasThumb = true;
    batch.push(t);
  }
  for (let i = 0; i < batch.length; i += 200) loadBatch(batch.slice(i, i + 200));
}

async function loadBatch(list) {
  const keys = list.map((t) => t.item.mini.match(/([0-9a-f]{32})\.jpg$/)[1]);
  let buf = null;
  try { buf = await fetch('/api/minis?k=' + keys.join('.')).then((r) => r.arrayBuffer()); } catch {}
  const view = buf && new DataView(buf);
  let o = 0;
  await Promise.all(list.map(async (t) => {
    let src = null;
    if (view && o + 4 <= buf.byteLength) {
      const len = view.getUint32(o, true);
      const bytes = buf.slice(o + 4, o + 4 + len);
      o += 4 + len;
      if (len) src = await createImageBitmap(new Blob([bytes], { type: 'image/jpeg' })).catch(() => null);
    }
    settleTile(t, src);
  }));
}

function settleTile(t, src) {
  if (!atlasCtx || tiles.get(t.item.id) !== t) return; // a newer run replaced this one
  // Render the rounded sprite once into a decoded bitmap that every later draw reuses.
  const oc = new OffscreenCanvas(CELL, CELL);
  paintSprite(oc.getContext('2d'), 0, 0, src);
  t.bmp = oc.transferToImageBitmap();
  atlasCtx.drawImage(t.bmp, t.ax, t.ay);
  Object.assign(t, src ? colourOf(src) : { hue: 0, sat: 0, lum: .5 });
  src?.close?.();
  t.ready = true; readyCount++; lastLoadAt = performance.now();
  if (t.inPile) pileDirty = true;
}

// ----- colour wheel -----
// Before the folders, the ball re-forms as a colour wheel: hue around, saturation outward.

const sampler = new OffscreenCanvas(10, 10).getContext('2d', { willReadFrequently: true });
function colourOf(img) {
  sampler.clearRect(0, 0, 10, 10);
  sampler.drawImage(img, 0, 0, 10, 10);
  const d = sampler.getImageData(0, 0, 10, 10).data;
  // Saturation-weighted circular mean of hue, so a red jacket on white still reads as red.
  let x = 0, y = 0, satSum = 0, lumSum = 0;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, c = max - min;
    const sat = c === 0 ? 0 : c / (1 - Math.abs(2 * l - 1));
    let h = 0;
    if (c) h = max === r ? ((g - b) / c) % 6 : max === g ? (b - r) / c + 2 : (r - g) / c + 4;
    const a = h * Math.PI / 3, w = sat * sat;
    x += Math.cos(a) * w; y += Math.sin(a) * w; satSum += sat; lumSum += l;
  }
  const n = d.length / 4;
  return { hue: (Math.atan2(y, x) * 180 / Math.PI + 360) % 360, sat: satSum / n, lum: lumSum / n };
}

let morphStart = 0, morphEnd = 0;
function startColourMorph() {
  const R = pileW / 2 - 26;
  // Like an iris: neutrals fill the middle from white to black, colours ring the outside by hue.
  const greys = pileOrder.filter((t) => t.sat <= .22).sort((a, b) => b.lum - a.lum);
  const colours = pileOrder.filter((t) => t.sat > .22).sort((a, b) => a.sat - b.sat);
  const n = pileOrder.length;
  const place = (t, rank, angle) => {
    const radius = R * (0.05 + 0.95 * Math.sqrt((rank + .5) / n)); // equal-area rings
    t.from = { dx: t.dx, dy: t.dy, rot: t.rot };
    t.to = { dx: Math.cos(angle) * radius, dy: Math.sin(angle) * radius, rot: (Math.random() - .5) * 14 };
  };
  greys.forEach((t, i) => { place(t, i, Math.random() * Math.PI * 2); t.delay = 200 + Math.random() * 500; });
  colours.forEach((t, i) => { place(t, greys.length + i, (t.hue - 90) * Math.PI / 180 + (Math.random() - .5) * 0.1); t.delay = (t.hue / 360) * 700 + Math.random() * 150; });
  const bySat = [...greys, ...colours];
  // Paint vivid tiles last so the rim of the wheel stays clean.
  pileOrder = bySat;
  morphStart = performance.now();
  morphEnd = morphStart + 700 + 150 + 1300;
  setTimeout(() => {
    for (const t of pileOrder) { Object.assign(t, t.to); t.from = t.to = null; }
    pileDirty = true;
  }, morphEnd - morphStart + 20);
  return morphEnd - morphStart;
}

const easeInOut = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function morphPose(t, now) {
  if (!t.from || now < morphStart) return t;
  const k = easeInOut(Math.max(0, Math.min(1, (now - morphStart - t.delay) / 1300)));
  return {
    dx: t.from.dx + (t.to.dx - t.from.dx) * k,
    dy: t.from.dy + (t.to.dy - t.from.dy) * k,
    rot: t.from.rot + (t.to.rot - t.from.rot) * k,
  };
}

// ----- folder cards -----

function getCard(category) {
  if (cards.has(category)) return cards.get(category);
  // Put each new folder on whichever side of the ball has fewer.
  const left = $('left').querySelector('.grid'), right = $('right').querySelector('.grid');
  const grid = left.children.length <= right.children.length ? left : right;
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="card-head">${FOLDER_SVG}<span></span><span class="count">0</span></div><canvas class="slots"></canvas>`;
  el.querySelector('.card-head span').textContent = category;
  el.onclick = () => openFolder(category, el);
  grid.appendChild(el);

  const canvas = el.querySelector('.slots');
  const cols = Math.max(1, Math.floor((canvas.clientWidth + GAP) / PITCH));
  canvas.style.height = (ROWS * PITCH - GAP) + 'px';
  canvas.width = Math.round(canvas.clientWidth * DPR);
  canvas.height = Math.round((ROWS * PITCH - GAP) * DPR);
  const card = { el, canvas, ctx: canvas.getContext('2d'), cols, capacity: cols * ROWS, origin: null, filled: 0, count: 0, items: [] };
  cards.set(category, card);
  measure(card);
  requestAnimationFrame(() => el.classList.add('in'));
  if (category !== 'Duplicates') tween($('sFolders'), [...cards.keys()].filter((c) => c !== 'Duplicates').length, 250);
  return card;
}

// The card canvas origin in page coordinates, cached so flights never force a layout.
function measure(card) {
  const r = card.canvas.getBoundingClientRect();
  card.origin = { x: r.left + scrollX, y: r.top + scrollY };
}
const slotXY = (card, k) => ({ x: (k % card.cols) * PITCH, y: Math.floor(k / card.cols) * PITCH });

function paintSlot(card, k, tile, more) {
  const g = card.ctx, { x, y } = slotXY(card, k);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect((x - 1) * DPR, (y - 1) * DPR, (SLOT + 2) * DPR, (SLOT + 2) * DPR);
  g.drawImage(tile.bmp, x * DPR, y * DPR, SLOT * DPR, SLOT * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (tile.item.kind === 'video') {
    g.fillStyle = '#fff';
    g.beginPath(); g.moveTo(x + SLOT - 9, y + SLOT - 11); g.lineTo(x + SLOT - 9, y + SLOT - 5); g.lineTo(x + SLOT - 4, y + SLOT - 8); g.fill();
  }
  if (more) {
    g.fillStyle = 'rgba(28,31,34,.6)';
    g.beginPath(); g.roundRect(x + 1.5, y + 1.5, SLOT - 3, SLOT - 3, 6); g.fill();
    g.fillStyle = '#fff'; g.font = '600 9.5px Inter, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(more, x + SLOT / 2, y + SLOT / 2 + .5);
  }
}
addEventListener('resize', () => cards.forEach(measure));

// Where a pile tile currently sits on the page, from its offset and the spin angle (no DOM read).
function pilePoint(t, center, angleDeg) {
  const a = angleDeg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return { x: center.x + t.dx * c - t.dy * s - 15, y: center.y + t.dx * s + t.dy * c - 15, rot: t.rot + angleDeg };
}

function fly(tile, card, start) {
  const { item } = tile;
  tile.inPile = false;
  pileDirty = true;
  const el = spriteCanvas(tile);
  el.className = 'fly';
  const slotIdx = Math.min(card.filled, card.capacity - 1);
  card.filled++;
  card.items.push(item);
  const off = slotXY(card, slotIdx);
  const to = { x: card.origin.x + off.x, y: card.origin.y + off.y };

  el.style.transform = `translate(${start.x}px, ${start.y}px) rotate(${start.rot}deg)`;
  $('layer').appendChild(el);

  const done = () => {
    el.remove();
    card.count++;
    card.el.querySelector('.count').textContent = card.count.toLocaleString();
    const over = card.count - card.capacity;
    paintSlot(card, slotIdx, tile, over > 0 ? '+' + (over + 1) : null);
    inFlight--; landed++;
    maybeFinish();
  };
  inFlight++;
  if (reduceMotion) { done(); return; }

  const x1 = to.x - 2, y1 = to.y - 2;
  const mx = (start.x + x1) / 2, my = Math.min(start.y, y1) - 50 - Math.random() * 60;
  const dist = Math.hypot(x1 - start.x, y1 - start.y);
  el.animate([
    { transform: `translate(${start.x}px, ${start.y}px) rotate(${start.rot}deg) scale(1)` },
    { transform: `translate(${mx}px, ${my}px) rotate(${start.rot * .3}deg) scale(1.25)`, offset: 0.5, easing: 'cubic-bezier(.3,0,.6,1)' },
    { transform: `translate(${x1}px, ${y1}px) rotate(0deg) scale(.94)` },
  ], { duration: Number.isFinite(dist) ? 700 + dist * 0.6 : 900, easing: 'cubic-bezier(.33,0,.2,1)', fill: 'forwards' }).onfinish = done;
}

// One read of the pile position per frame, then only writes: no layout thrash.
function frame() {
  if (!running) return;
  if (queue.length) {
    const r = $('pile').getBoundingClientRect();
    const center = { x: r.left + scrollX + r.width / 2, y: r.top + scrollY + r.height / 2 };
    const angle = spinAnim ? (spinAnim.currentTime % SPIN_MS) / SPIN_MS * 360 : 0;
    // Steady stream: 1 per frame, 2 with a backlog, and never too many in the air at once.
    // Ease in over the first second so the stream builds up instead of bursting.
    const ramp = Math.min(1, (performance.now() - flightStart) / 1200);
    launchCredit += ramp * Math.min(2, Math.max(1, queue.length / 150));
    const n = Math.min(Math.floor(launchCredit), MAX_IN_FLIGHT - inFlight);
    launchCredit -= Math.max(0, n);
    for (let k = 0; k < n; k++) {
      // Only launch tiles whose image is already drawn, so the flight never waits on a decode.
      const idx = queue.findIndex((q, i) => i < 40 && tiles.get(q.id).ready);
      if (idx < 0) break;
      const { id, category, labels } = queue.splice(idx, 1)[0];
      const tile = tiles.get(id);
      tile.labels = labels || [];
      showThumbs([id]);
      fly(tile, getCard(category), pilePoint(tile, center, angle));
    }
  }
  requestAnimationFrame(frame);
}

function maybeFinish() {
  if (!serverDone || queue.length || inFlight) return;
  running = false;
  spinAnim?.pause();
  pileDirty = true;
  $('ring').classList.remove('on');
  $('bar').classList.remove('on');
  setStatus('Done', false);
  const folders = [...cards.keys()].filter((c) => c !== 'Duplicates').length;
  $('caption').textContent = `${landed.toLocaleString()} files sorted into ${folders} folders`;
  $('sortBtn').disabled = false;
  $('doneActions').classList.add('on');
  const d = stats().dupes;
  if (d.count) {
    say(`Done. ${landed.toLocaleString()} files in ${folders} folders. I also found ${d.count} duplicates wasting ${fmtBytes(d.bytes, true)}. Want me to clear them?`);
    pending = 'dupes';
  } else {
    say(`Done. ${landed.toLocaleString()} files in ${folders} folders.`);
  }
}

// ----- numbers for the voice and Wrapped -----

function fmtBytes(b, spoken) {
  const gb = b / 1e9;
  if (gb >= 1) return gb.toFixed(1) + (spoken ? ' gigabytes' : ' GB');
  return Math.round(b / 1e6) + (spoken ? ' megabytes' : ' MB');
}

const GENERIC = new Set(['people', 'adult', 'child', 'structure', 'building', 'outdoor', 'sky', 'blue_sky', 'cloudy', 'land', 'plant',
  'clothing', 'apparel', 'interior_room', 'material', 'textile', 'wood_processed', 'sign', 'consumer_electronics', 'machine',
  'conveyance', 'vehicle', 'art', 'illustrations', 'document', 'screenshot', 'text', 'footwear', 'shoes', 'portrait', 'grass',
  'water', 'foliage', 'tree', 'housewares', 'container', 'decoration', 'light', 'paper', 'wall', 'cord', 'liquid', 'raw_glass']);
const PERSONALITY = {
  'Content': ['The Creator', 'You save ideas faster than you can post them.'],
  'People & family': ['The Social One', 'Your downloads are mostly the people you love.'],
  'Outfits': ['The Stylist', 'Half your downloads are fits. No notes.'],
  'Business': ['The Operator', 'Screenshots, docs, receipts. You run things.'],
  'Travel': ['The Explorer', 'Always somewhere new.'],
  'Food': ['The Foodie', 'Eat first, post later.'],
  'Nature': ['The Wanderer', 'You stop for every sunset.'],
  'Animals': ['The Pet Person', 'The camera roll belongs to the animals.'],
  'Other': ['The Collector', 'A little bit of everything. Mysterious.'],
};
const HUES = [[15, 'Red', '#d9534f'], [40, 'Orange', '#e8893a'], [65, 'Yellow', '#e6c84a'], [160, 'Green', '#5fae6b'],
  [195, 'Teal', '#3fa6a6'], [250, 'Blue', '#4a7fd6'], [290, 'Purple', '#8a63c9'], [345, 'Pink', '#d96aa7'], [361, 'Red', '#d9534f']];

function stats() {
  const all = [...tiles.values()];
  const dupes = all.filter((t) => cards.get('Duplicates')?.items.includes(t.item));
  const folders = [...cards.entries()].filter(([c]) => c !== 'Duplicates' && c !== 'Other').sort((a, b) => b[1].count - a[1].count);
  // Most-saved specific thing, from the on-device labels.
  const counts = new Map();
  for (const t of all) for (const l of t.labels.slice(0, 4)) if (!GENERIC.has(l)) counts.set(l, (counts.get(l) || 0) + 1);
  const [topLabel, topCount] = [...counts.entries()].sort((a, b) => b[1] - a[1])[0] || [null, 0];
  // Colour: share of greys vs. the most common hue among colourful files.
  const colourful = all.filter((t) => t.sat > .22);
  const hueCount = new Map();
  for (const t of colourful) { const h = HUES.find(([max]) => t.hue < max); hueCount.set(h[1], (hueCount.get(h[1]) || 0) + 1); }
  const [hueName] = [...hueCount.entries()].sort((a, b) => b[1] - a[1])[0] || ['Grey'];
  return {
    total: all.length,
    bytes: runItems.reduce((a, i) => a + (i.size || 0), 0),
    photos: runItems.filter((i) => i.kind === 'photo').length,
    videos: runItems.filter((i) => i.kind === 'video').length,
    dupes: { count: dupes.length, bytes: dupes.reduce((a, t) => a + (t.item.size || 0), 0) },
    topFolder: folders[0] ? { name: folders[0][0], count: folders[0][1].count, items: folders[0][1].items } : null,
    topLabel: topLabel && { name: topLabel, count: topCount, items: all.filter((t) => t.labels.includes(topLabel)).map((t) => t.item) },
    mono: colourful.length < all.length * .45,
    hue: { name: hueName, swatch: (HUES.find((h) => h[1] === hueName) || [0, 0, '#888'])[2] },
    byHue: colourful.slice().sort((a, b) => a.hue - b.hue).map((t) => t.item),
  };
}

// ----- run -----

function startSort() {
  if ($('sortBtn').disabled) return;
  reset();
  hush();
  say('On it. Let me look through your downloads.');
  $('sortBtn').disabled = true;
  const dir = $('dir').value.trim() || '~/Downloads';
  $('dirName').textContent = dir.replace(/\/$/, '').split('/').pop() || dir;
  setStatus('Collecting photos & videos…', true);
  $('caption').textContent = 'Collecting photos & videos…';

  const es = new EventSource('/api/sort?dir=' + encodeURIComponent(dir));
  let dupes = 0;
  es.addEventListener('scan', (e) => {
    const { items } = JSON.parse(e.data);
    if (!items.length) { $('caption').textContent = 'No photos or videos in that folder'; setStatus('Ready'); $('sortBtn').disabled = false; es.close(); return; }
    runItems = items;
    say(`Found ${items.length.toLocaleString()} files. Sorting them by colour first.`);
    tween($('sTotal'), items.length, 1500);
    tween($('sPhotos'), items.filter((i) => i.kind === 'photo').length, 1500);
    tween($('sVideos'), items.filter((i) => i.kind === 'video').length, 1500);
    buildPile(items);
    $('ring').classList.add('on');
    // Let the pile land and its thumbnails finish loading (atlas uploads are what stutter), then fly.
    const t0 = performance.now();
    const waitThenFly = () => {
      const now = performance.now();
      // The colour wheel needs every thumbnail's colour, so wait for all of them (capped for huge folders).
      const settled = readyCount === items.length || (readyCount > items.length * .97 && now - lastLoadAt > 800);
      if (now - t0 > 2200 && (settled || now - t0 > 15000)) {
        $('caption').textContent = 'Sorting by colour…';
        const ms = reduceMotion ? 0 : startColourMorph();
        // Hold the finished wheel for a beat, then fly into folders.
        setTimeout(() => {
          // Lay out every folder we already know about first, so no card pops in mid-flight.
          [...new Set(queue.map((q) => q.category))].forEach(getCard);
          say('Now, into folders.');
          setTimeout(() => { running = true; flightStart = performance.now(); launchCredit = 0; requestAnimationFrame(frame); }, 450);
        }, ms + 1100);
      }
      else setTimeout(waitThenFly, 100);
    };
    waitThenFly();
  });
  es.addEventListener('thumbs', (e) => showThumbs(JSON.parse(e.data).ids));
  es.addEventListener('sorted', (e) => {
    const a = JSON.parse(e.data);
    if (a.category === 'Duplicates') tween($('sDupes'), ++dupes, 200);
    queue.push(a);
  });
  es.addEventListener('progress', (e) => {
    const { phase, done, total } = JSON.parse(e.data);
    $('caption').textContent = `Sorting into folders… ${done.toLocaleString()} / ${total.toLocaleString()}`;
    setStatus(phase + '…', true);
    $('bar').classList.add('on');
    $('bar').firstElementChild.style.transform = `scaleX(${done / total})`;
  });
  es.addEventListener('done', () => { es.close(); serverDone = true; maybeFinish(); });
  es.addEventListener('failure', (e) => {
    es.close();
    $('caption').textContent = JSON.parse(e.data).message;
    setStatus('Error'); $('sortBtn').disabled = false;
  });
}
$('sortBtn').onclick = startSort;

async function apply(mode) {
  if (mode === 'move' && !confirm('Move the original files into a Sorted/ folder? They will leave their current location.')) return;
  $('copyBtn').disabled = $('moveBtn').disabled = true;
  setStatus(mode === 'move' ? 'Moving files…' : 'Copying files…', true);
  const r = await fetch('/api/apply?mode=' + mode, { method: 'POST' }).then((r) => r.json());
  if (r.error) { setStatus('Error'); $('caption').textContent = r.error; $('copyBtn').disabled = $('moveBtn').disabled = false; return; }
  setStatus('Done', false);
  $('caption').textContent = `${r.files.toLocaleString()} files ${mode === 'move' ? 'moved' : 'copied'} to ${r.folder}`;
}
$('copyBtn').onclick = () => apply('copy');
$('moveBtn').onclick = () => apply('move');

// ----- folder view -----

function openView(title, items, fromEl) {
  $('vTitle').textContent = title;
  $('vCount').textContent = `${items.length.toLocaleString()} ${items.length === 1 ? 'file' : 'files'}`;
  const grid = $('vGrid');
  grid.innerHTML = '';
  if (!items.length) grid.innerHTML = '<div class="empty">Nothing here yet</div>';
  const frag = document.createDocumentFragment();
  items.forEach((it, i) => {
    const f = document.createElement('figure');
    if (it.kind === 'video') f.className = 'video';
    const img = document.createElement('img');
    img.loading = 'lazy'; img.src = it.thumb; img.alt = it.name; img.title = it.name;
    f.appendChild(img);
    if (i < 40 && !reduceMotion) f.animate([{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: 120 + i * 12, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    frag.appendChild(f);
  });
  grid.appendChild(frag);
  $('vScroll').scrollTop = 0;

  const viewer = $('viewer'), sheet = $('sheet');
  viewer.classList.add('on');
  if (reduceMotion) return;
  viewer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250 });
  // Grow the sheet out of the card that was opened.
  if (fromEl) {
    const a = fromEl.getBoundingClientRect(), b = sheet.getBoundingClientRect();
    sheet.animate([
      { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, borderRadius: '20px' },
      { transform: 'none', borderRadius: '28px' },
    ], { duration: 480, easing: 'cubic-bezier(.2,.8,.2,1)' });
  } else {
    sheet.animate([{ opacity: 0, transform: 'translateY(24px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}

function openFolder(category, fromEl) {
  const card = cards.get(category);
  if (!card) return say(`There's no ${category} folder yet.`);
  say(`Here's ${category}. ${card.count.toLocaleString()} ${card.count === 1 ? 'file' : 'files'}.`);
  document.querySelectorAll('.card.hit').forEach((c) => c.classList.remove('hit'));
  card.el.classList.add('hit');
  setTimeout(() => card.el.classList.remove('hit'), 1500);
  openView(category, card.items, fromEl || card.el);
}

function closeView() {
  const viewer = $('viewer');
  if (!viewer.classList.contains('on')) return;
  if (reduceMotion) return viewer.classList.remove('on');
  viewer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200 }).onfinish = () => viewer.classList.remove('on');
}
$('vClose').onclick = closeView;
$('viewer').onclick = (e) => { if (e.target === $('viewer')) closeView(); };

// "find sneakers" searches the on-device Vision labels of every sorted file.
function findThings(query) {
  const words = query.toLowerCase().replace(/[^a-z ]/g, '').split(/\s+/).filter((w) => w && !['a', 'an', 'the', 'of', 'my', 'all', 'photos', 'pictures', 'pics', 'images', 'with'].includes(w));
  if (!words.length) return;
  const stem = (w) => w.replace(/(es|s)$/, '');
  const stems = words.map(stem);
  const hits = [];
  for (const t of tiles.values()) {
    if (!t.labels.length) continue;
    if (t.labels.some((l) => l.split('_').some((p) => stems.includes(stem(p))))) hits.push(t.item);
  }
  openView(query.replace(/^\w/, (c) => c.toUpperCase()), hits);
  say(hits.length ? `Found ${hits.length} ${query}.` : `I couldn't find any ${query}.`);
}

// ----- commands (voice or typed) -----

const ALIASES = {
  'Outfits': ['outfit', 'outfits', 'clothes', 'clothing', 'fashion', 'apparel', 'fits'],
  'People & family': ['people', 'family', 'friends', 'selfies', 'selfie', 'portraits'],
  'Food': ['food', 'foods', 'cafes', 'cafe', 'drinks', 'eating', 'restaurants'],
  'Travel': ['travel', 'trips', 'trip', 'places', 'holiday', 'holidays', 'vacation'],
  'Business': ['business', 'work', 'documents', 'docs', 'screenshots', 'screenshot'],
  'Content': ['content', 'ai', 'generations', 'generated', 'creative', 'recordings'],
  'Nature': ['nature', 'outdoors', 'landscapes', 'plants', 'flowers'],
  'Animals': ['animals', 'animal', 'pets', 'pet', 'dogs', 'cats'],
  'Duplicates': ['duplicates', 'duplicate', 'dupes', 'copies'],
  'Other': ['other', 'misc', 'miscellaneous', 'everything else'],
};

function matchFolder(text) {
  const words = text.toLowerCase().replace(/[^a-z& ]/g, ' ').split(/\s+/);
  for (const [cat, keys] of Object.entries(ALIASES)) {
    if (keys.some((k) => k.includes(' ') ? text.toLowerCase().includes(k) : words.includes(k))) return cat;
  }
  return null;
}

function runCommand(raw) {
  const text = raw.trim().toLowerCase().replace(/[.!?]$/, '');
  if (!text) return;
  hush();
  toast(`“${raw.trim()}”`);
  if (pending === 'dupes' && /^(yes|yeah|yep|sure|go on|do it|please|clear them|ok|okay)\b/.test(text)) return clearDupes();
  if (pending && /^(no|nope|not now|leave it|don'?t)\b/.test(text)) { pending = null; return say('No problem. They are still in the Duplicates folder.'); }
  if (/^(mute|be quiet|stop talking|shh)/.test(text)) { if (!muted) $('mute').click(); return; }
  if (/^(unmute|talk to me|speak)/.test(text)) { if (muted) $('mute').click(); return say("I'm back."); }
  if (/(clear|delete|remove|bin|trash).*(duplicate|dupe|copies)/.test(text)) return cards.has('Duplicates') ? clearDupes() : say('There are no duplicates to clear.');
  if (/(wrap|recap|my stats|year in review)/.test(text)) return openWrapped();
  if (/^(close|back|go back|exit|done|hide|never ?mind)\b/.test(text)) { closeWrapped(); return closeView(); }
  if (/^(sort|start|go|let'?s go|sort (my |the )?(downloads|files|folder|photos))\b/.test(text)) { closeView(); return startSort(); }
  const find = text.match(/^(?:find|search(?: for)?|look for|where (?:are|is))\s+(?:my\s+|the\s+|all\s+)?(.+)$/);
  if (find) return findThings(find[1]);
  const open = text.match(/^(?:pull up|open|show(?: me)?|go to|bring up|let'?s see|view)\s+(?:my\s+|the\s+)?(.+?)(?:\s+folder)?$/);
  const target = open ? open[1] : text;
  const folder = matchFolder(target);
  if (folder) return openFolder(folder);
  // Not a folder name: treat "show me sneakers" as a search.
  if (open) return findThings(open[1]);
  say(`Sorry, I didn't catch that. Try "pull up outfits".`);
}

// ----- the assistant's voice -----

let muted = false, voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  const prefer = ['Daniel', 'Google UK English Male', 'Arthur', 'Oliver', 'Serena', 'Google UK English Female'];
  voice = prefer.map((n) => vs.find((v) => v.name.startsWith(n))).find(Boolean) || vs.find((v) => v.lang === 'en-GB') || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// Lines queue up; a new command from the user interrupts (see runCommand).
function say(text) {
  const bubble = $('say');
  const show = () => {
    clearTimeout(say.timer); $('sayText').textContent = text; bubble.classList.add('on', 'talking');
    say.timer = setTimeout(hide, 3000 + text.length * 60); // in case onend never fires
  };
  const hide = () => { bubble.classList.remove('talking'); clearTimeout(say.timer); say.timer = setTimeout(() => bubble.classList.remove('on'), 2200); };
  if (muted || !('speechSynthesis' in window)) { show(); say.timer = setTimeout(hide, 1500 + text.length * 40); return; }
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.rate = 1.04; u.pitch = 1;
  u.onstart = show;
  // Subtitles must never depend on audio actually playing (no voices, blocked autoplay).
  if (!speechSynthesis.speaking && !speechSynthesis.pending) show();
  setTimeout(() => { if ($('sayText').textContent !== text && !speechSynthesis.speaking) show(); }, 1500);
  u.onend = () => { if (!speechSynthesis.pending) hide(); };
  u.onerror = hide;
  speechSynthesis.speak(u);
}
const hush = () => window.speechSynthesis?.cancel();
$('mute').onclick = () => {
  muted = !muted;
  $('mute').classList.toggle('muted', muted);
  if (muted) speechSynthesis?.cancel();
};

async function clearDupes() {
  pending = null;
  say('Moving them to the Bin.');
  const r = await fetch('/api/trash-dupes', { method: 'POST' }).then((r) => r.json()).catch(() => ({ error: 'Server not reachable' }));
  if (r.error) return say(`Sorry, that didn't work. ${r.error}.`);
  const card = cards.get('Duplicates');
  if (card) { card.el.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.94)' }], { duration: 500, fill: 'forwards' }).onfinish = () => card.el.remove(); }
  tween($('sDupes'), 0, 800);
  say(`Done. ${r.files} duplicates are in the Bin. That's ${fmtBytes(r.bytes, true)} back.`);
}

// ----- Downloads Wrapped -----

let wSlides = [], wIndex = 0, wTimer = null, wStart = 0;
const W_MS = 4600;

function imgs(items, n) {
  return items.slice(0, n).map((it) => `<img src="${it.thumb}" alt="">`).join('');
}

function buildSlides() {
  const st = stats();
  const slides = [];
  const bg = imgs(runItems.slice().sort(() => Math.random() - .5), 60);
  slides.push({
    html: `<div class="w-bg">${bg}</div><div class="w-kicker w-rise">${new Date().getFullYear()}</div><div class="w-sub w-rise" style="margin:0 0 6px">Your Downloads,</div><div class="w-serif w-rise">Wrapped.</div>`,
    line: 'Your Downloads, wrapped.', glow: '#2f5d62',
  });
  slides.push({
    html: `<div class="w-kicker w-rise">You saved</div><div class="w-big w-rise" data-count="${st.total}">0</div><div class="w-sub w-rise">files. ${st.photos.toLocaleString()} photos, ${st.videos.toLocaleString()} videos, ${fmtBytes(st.bytes)} in total.</div>`,
    line: `You saved ${st.total.toLocaleString()} files. That's ${fmtBytes(st.bytes, true)}.`, glow: '#3d6b70',
  });
  if (st.topFolder) slides.push({
    html: `<div class="w-kicker w-rise">Your biggest folder</div><div class="w-serif w-rise">${st.topFolder.name}</div><div class="w-sub w-rise">${st.topFolder.count.toLocaleString()} files</div><div class="w-mosaic w-rise">${imgs(st.topFolder.items, 9)}</div>`,
    line: `Your biggest folder: ${st.topFolder.name}. ${st.topFolder.count} files.`, glow: '#8fa89b',
  });
  if (st.topLabel) {
    const name = st.topLabel.name.replace(/_/g, ' ').replace(/([^s])$/, '$1s');
    slides.push({
      html: `<div class="w-kicker w-rise">You really, really love</div><div class="w-serif w-rise">${name}.</div><div class="w-sub w-rise">${st.topLabel.count} of them, to be exact.</div><div class="w-mosaic w-rise">${imgs(st.topLabel.items, 9)}</div>`,
      line: `You really love ${name}. ${st.topLabel.count} of them.`, glow: '#6b5f8a',
    });
  }
  slides.push(st.mono ? {
    html: `<div class="w-swatch w-rise" style="background:conic-gradient(#111,#777,#eee,#777,#111)"></div><div class="w-kicker w-rise">Your colour</div><div class="w-serif w-rise">Monochrome.</div><div class="w-sub w-rise">Black, white and everything in between.</div><div class="w-band w-rise">${imgs(st.byHue.filter((_, i) => i % Math.max(1, Math.floor(st.byHue.length / 40)) === 0), 40)}</div>`,
    line: 'Your colour: monochrome. Black, white, and everything in between.', glow: '#555',
  } : {
    html: `<div class="w-swatch w-rise" style="background:${st.hue.swatch}"></div><div class="w-kicker w-rise">Your colour</div><div class="w-serif w-rise">${st.hue.name}.</div><div class="w-band w-rise">${imgs(st.byHue.filter((_, i) => i % Math.max(1, Math.floor(st.byHue.length / 40)) === 0), 40)}</div>`,
    line: `Your colour is ${st.hue.name.toLowerCase()}.`, glow: st.hue.swatch,
  });
  if (st.dupes.count) slides.push({
    html: `<div class="w-kicker w-rise">Also…</div><div class="w-big w-rise" data-count="${st.dupes.count}">0</div><div class="w-sub w-rise">duplicates, wasting <b>${fmtBytes(st.dupes.bytes)}</b>.</div>`,
    line: `You've got ${st.dupes.count} duplicates wasting ${fmtBytes(st.dupes.bytes, true)}.`, glow: '#8a4b45',
  });
  const [title, blurb] = PERSONALITY[st.topFolder?.name] || PERSONALITY.Other;
  slides.push({
    html: `<div class="w-kicker w-rise">Your Downloads personality</div><div class="w-serif w-rise">${title}</div><div class="w-sub w-rise">${blurb}</div>
      <div class="w-cta w-rise">${st.dupes.count && cards.has('Duplicates') ? '<button class="btn" data-act="dupes">Clear duplicates</button>' : ''}<button class="btn ghost" data-act="replay">Replay</button></div>`,
    line: `Your Downloads personality: ${title}. ${blurb}`, glow: '#2f5d62', last: true,
  });
  return slides;
}

function openWrapped() {
  if (!landed) return say('Sort your downloads first, then I can wrap them up.');
  closeView();
  wSlides = buildSlides();
  $('wBars').innerHTML = wSlides.map(() => '<i><b></b></i>').join('');
  $('wrapped').classList.add('on');
  if (!reduceMotion) $('wrapped').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
  showSlide(0);
}

function closeWrapped() {
  clearTimeout(wTimer);
  $('wrapped').classList.remove('on');
}

function showSlide(i) {
  clearTimeout(wTimer);
  if (i < 0) i = 0;
  if (i >= wSlides.length) return; // stay on the last slide
  wIndex = i;
  const sl = wSlides[i];
  const el = document.createElement('div');
  el.className = 'w-slide';
  el.innerHTML = `<div class="w-glow" style="background:${sl.glow}"></div>` + sl.html;
  const stage = $('wStage');
  for (const old of [...stage.children]) {
    old.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.98)' }], { duration: 300, fill: 'forwards' }).onfinish = () => old.remove();
  }
  stage.appendChild(el);
  el.querySelectorAll('.w-rise').forEach((n, k) => n.animate(
    [{ opacity: 0, transform: 'translateY(26px)' }, { opacity: 1, transform: 'none' }],
    { duration: reduceMotion ? 1 : 700, delay: reduceMotion ? 0 : 150 + k * 140, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }));
  el.querySelectorAll('[data-count]').forEach((n) => setTimeout(() => tween(n, Number(n.dataset.count), 1400), 300));
  el.querySelectorAll('.w-bg').forEach((n) => !reduceMotion && n.animate([{ transform: 'rotate(-8deg) translateY(0)' }, { transform: 'rotate(-8deg) translateY(-6%)' }], { duration: 9000, fill: 'forwards' }));
  el.querySelectorAll('[data-act]').forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    if (b.dataset.act === 'replay') showSlide(0);
    if (b.dataset.act === 'dupes') { closeWrapped(); clearDupes(); }
  });
  // Progress bars: earlier full, current animating.
  [...$('wBars').children].forEach((bar, k) => {
    const fill = bar.firstElementChild;
    fill.getAnimations().forEach((a) => a.cancel());
    fill.style.transform = `scaleX(${k < i ? 1 : 0})`;
    if (k === i) fill.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: W_MS, fill: 'forwards' });
  });
  hush();
  say(sl.line);
  if (!sl.last) wTimer = setTimeout(() => showSlide(i + 1), W_MS);
}

$('wClose').onclick = (e) => { e.stopPropagation(); closeWrapped(); };
$('wrapped').onclick = (e) => {
  if (e.target.closest('button')) return;
  showSlide(e.clientX < innerWidth / 3 ? wIndex - 1 : wIndex + 1);
};
$('wrapBtn').onclick = openWrapped;

$('cmd').onsubmit = (e) => { e.preventDefault(); runCommand($('cmdInput').value); $('cmdInput').value = ''; $('cmdInput').blur(); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function startListening() {
  if (!SR) { toast('Voice needs Chrome or Safari — typing works too'); $('cmdInput').focus(); return; }
  if (listening) return;
  rec = new SR();
  rec.lang = 'en-GB'; rec.interimResults = true; rec.continuous = false;
  let final = '';
  rec.onresult = (e) => {
    const r = [...e.results].map((x) => x[0].transcript).join('');
    $('cmdInput').value = r;
    if (e.results[e.results.length - 1].isFinal) final = r;
  };
  rec.onerror = (e) => { if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Mic: ' + e.error); };
  rec.onend = () => {
    listening = false; $('mic').classList.remove('live');
    const said = final || $('cmdInput').value;
    $('cmdInput').value = '';
    if (said) runCommand(said);
  };
  speechSynthesis?.cancel();
  listening = true; $('mic').classList.add('live');
  $('cmdInput').value = ''; $('cmdInput').placeholder = 'Listening…';
  rec.start();
  setTimeout(() => $('cmdInput').placeholder = 'Say or type a command…', 4000);
}
function stopListening() { if (listening) rec.stop(); }

$('mic').onclick = () => listening ? stopListening() : startListening();
// Hold Space to talk (when not typing).
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.code === 'Space' && !e.repeat) { e.preventDefault(); startListening(); }
  if (e.key === 'Escape') { closeWrapped(); closeView(); }
  if ($('wrapped').classList.contains('on') && e.key === 'ArrowRight') showSlide(wIndex + 1);
  if ($('wrapped').classList.contains('on') && e.key === 'ArrowLeft') showSlide(wIndex - 1);
  if (e.key === '/') { e.preventDefault(); $('cmdInput').focus(); }
});
addEventListener('keyup', (e) => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') stopListening(); });
setTimeout(() => $('hint').style.opacity = 0, 9000);
</script>
